name: tick harian

# 04:00 UTC = 11:00 WIB, Monday-Friday. Not 07:00 WIB on purpose: /v2/suspensions/
# — the primary label source — is only refreshed at 10:00 WIB. IDX market holidays
# are skipped inside app/tick.py, which still records a line so the history has no
# unexplained gaps. See mersamur/riset/spec.md section 6.
on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

# The run log is committed back to the repository, so the history grows in a place
# judges can read without trusting a screenshot.
permissions:
  contents: write

concurrency:
  group: tick-harian
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies to install: the cycle is standard library only and reads
      # cached payloads. Its only network call is to Telegram, which spends no API
      # credits — SECTORS_API_KEY is deliberately not passed to this job, so a
      # cycle that started calling the live API would fail here rather than bill
      # the grant.
      #
      # With the two Telegram secrets unset the cycle still runs and still writes
      # its line; it records that delivery was not configured and moves on.
      - name: Jalankan satu siklus
        working-directory: mersamur
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 app/tick.py

      - name: Commit log run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # notified.json travels with the run log: it is what makes "only
          # transitions are sent" survive a runner that is destroyed after every
          # job. Left behind, every weekday would look like a first entrance and
          # the channel would repeat itself daily. It holds symbols and dates
          # only — never the bot token. It does not exist until the first cycle
          # that had something to deliver, so it is added only when present.
          for path in mersamur/state/runs.jsonl mersamur/state/notified.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "tidak ada perubahan pada runs.jsonl"
            exit 0
          fi
          git commit -m "chore(tick): record run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another tick or a human push may have landed since checkout.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
